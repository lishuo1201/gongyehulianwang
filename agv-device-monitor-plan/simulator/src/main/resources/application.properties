spring.application.name=agv-simulator
# Local access only: 模拟器 HTTP 入口默认只监听本机回环地址。
server.address=127.0.0.1
server.port=8081
# Read-only Modbus: 默认只在本机提供模拟设备读取，测试可使用端口0获得临时端口。
simulator.modbus.bind-address=127.0.0.1
simulator.modbus.port=1502

# Listener readiness: 就绪检查覆盖真实Modbus监听和定时更新，不只判断HTTP进程存在。
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,simulatorModbusServer
