spring.application.name=agv-backend
# Local access only: 无鉴权 Demo 默认只监听本机回环地址。
server.address=127.0.0.1
server.port=8080
# Require an explicit database: 数据库地址和凭据由运行环境提供，不默认连接个人数据库。
spring.datasource.hikari.connection-timeout=5000
# Use UTC per connection: DATETIME 不携带时区，应用和数据库会话统一按 UTC 解释。
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
