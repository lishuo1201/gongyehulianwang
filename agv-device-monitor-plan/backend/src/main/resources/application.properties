spring.application.name=agv-backend
# Local access only: 无鉴权 Demo 默认只监听本机回环地址。
server.address=127.0.0.1
server.port=8080
# Require an explicit database: 数据库地址和凭据由运行环境提供，不默认连接个人数据库。
spring.datasource.hikari.connection-timeout=5000
# Use UTC per connection: DATETIME 不携带时区，应用和数据库会话统一按 UTC 解释。
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
# Health groups: 设备离线不影响进程存活；数据库和采集服务决定是否就绪。
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,collector
spring.mvc.async.request-timeout=60000

# Bound database I/O: 数据库断网不能使采集/视图线程无限等待，连接池超时不代替驱动读超时。
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=1500
spring.datasource.hikari.data-source-properties.socketTimeout=2500
spring.jdbc.template.query-timeout=3s
# Local diagnostics: 只发布指标与健康，不公开环境/配置/堆转储。
management.endpoints.web.exposure.include=health,metrics
# Bound slow writes: 精简本地Demo的连接等待，配合SSE生命周期回收慢连接。
server.tomcat.connection-timeout=5s
